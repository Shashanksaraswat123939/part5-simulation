name: ci

# Tests every part and runs the car end to end with real OpenFOAM (ESI v2412).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      parts_ref:
        description: "branch of parts 1-3 to test"
        default: "main"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PARTS_REF: ${{ inputs.parts_ref || 'main' }}
  PY_DEPS: pytest numpy scipy pandas trimesh scikit-image shapely rtree mapbox-earcut manifold3d fast_simplification jax jaxlib matplotlib

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: part5-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part4-simulation, path: part4-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part1-simulation, ref: "${{ env.PARTS_REF }}", path: part1-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part2-simulation, ref: "${{ env.PARTS_REF }}", path: part2-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part3-simulation, ref: "${{ env.PARTS_REF }}", path: part3-simulation }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS
      - name: Five suites
        run: |
          set +e
          fail=0
          for p in part1-simulation part2-simulation part3-simulation part4-simulation part5-simulation; do
            (cd $p && PART2_PATH=$GITHUB_WORKSPACE/part2-simulation timeout 3600 python run_all_tests.py) > $p.log 2>&1
            code=$?; echo "exit $code" >> $p.log; [ $code -ne 0 ] && fail=1
            echo "::group::$p (exit $code)"; tail -30 $p.log; echo "::endgroup::"
          done
          {
            echo "## Unit tests ($PARTS_REF)"
            for p in part1-simulation part2-simulation part3-simulation part4-simulation part5-simulation; do
              echo "### $p"; echo '```'; grep -E "TOTAL|^FAIL|FAILED|exit" $p.log | tail -15; echo '```'
            done
          } >> $GITHUB_STEP_SUMMARY
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-test-logs, path: "*.log" }

  car:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: optimise_coarse_s4, args: "--cfd --optimise 4 --final-cfd --res coarse --smooth-mm 4" }
          - { id: optimise_medium_s4, args: "--cfd --optimise 3 --final-cfd --res medium --smooth-mm 4" }
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
        with: { path: part5-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part4-simulation, path: part4-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part1-simulation, ref: "${{ env.PARTS_REF }}", path: part1-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part2-simulation, ref: "${{ env.PARTS_REF }}", path: part2-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part3-simulation, ref: "${{ env.PARTS_REF }}", path: part3-simulation }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS
      - name: Install ESI OpenFOAM v2412
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y openfoam2412-default
      - name: Run the car (${{ matrix.id }})
        working-directory: part5-simulation
        run: |
          set -o pipefail
          mkdir -p ../out
          python ${{ matrix.script || 'run_car.py' }} --out ../out/${{ matrix.id }} --np 4 --keep-runs ${{ matrix.args }} 2>&1 | tee ../out/run_${{ matrix.id }}.log
          for f in report.md sign_check.json; do
            [ -f ../out/${{ matrix.id }}/$f ] && { echo '```'; cat ../out/${{ matrix.id }}/$f; echo '```'; } >> $GITHUB_STEP_SUMMARY
          done
          true
      - name: Rank the records
        if: always()
        working-directory: part5-simulation
        run: |
          if [ -d ../out/${{ matrix.id }}/records ]; then
            python merge_results.py ../out/${{ matrix.id }}/records | tee -a $GITHUB_STEP_SUMMARY || true
          fi
      - name: Collect solver logs
        if: always()
        run: |
          mkdir -p out/${{ matrix.id }}/solver_logs
          cp out/run_${{ matrix.id }}.log out/${{ matrix.id }}/ || true
          find part2-simulation/cfd_case_template -path "*/logs/*.log" 2>/dev/null | while read f; do
            d=$(basename "$(dirname "$(dirname "$f")")")
            tail -150 "$f" > "out/${{ matrix.id }}/solver_logs/${d}_$(basename "$f")"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-${{ matrix.id }}
          path: |
            out/${{ matrix.id }}/*.md
            out/${{ matrix.id }}/*.json
            out/${{ matrix.id }}/*.log
            out/${{ matrix.id }}/*.stl
            out/${{ matrix.id }}/parts*/*.json
            out/${{ matrix.id }}/parts*/*.stl
            out/${{ matrix.id }}/records/*.json
            out/${{ matrix.id }}/solver_logs/
