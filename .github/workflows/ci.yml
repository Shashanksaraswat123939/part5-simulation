name: ci

# simscale branch. On every push: all five test suites and the manufacturing-file
# check (neither touches SimScale). By hand (Actions > ci > Run workflow):
#   (the free probe -- import the start car's flow domain into SimScale and print
#   the face mapping, no mesh, no run -- runs on every push once the key secret is set)
#   car    the start car, meshed and solved on SimScale.
# SimScale steps need the repository secrets SIMSCALE_API_KEY and SIMSCALE_PROJECT_ID.
on:
  push:
    branches: [simscale]
  workflow_dispatch:
    inputs:
      simscale:
        description: "SimScale step: none, probe (free), car (uses core hours)"
        default: "none"
      res:
        description: "mesh preset for car: coarse, medium, fine, resolved"
        default: "medium"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_DEPS: pytest numpy scipy pandas trimesh scikit-image shapely rtree mapbox-earcut manifold3d fast_simplification jax jaxlib matplotlib requests
  SDK: git+https://github.com/SimScaleGmbH/simscale-python-sdk.git@19.1.0

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: part5-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part4-simulation, ref: simscale, path: part4-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part1-simulation, ref: simscale, path: part1-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part2-simulation, ref: simscale, path: part2-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part3-simulation, ref: simscale, path: part3-simulation }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS "$SDK"
      - name: Five suites
        run: |
          set +e
          fail=0
          for p in part1-simulation part2-simulation part3-simulation part4-simulation part5-simulation; do
            (cd $p && PART2_PATH=$GITHUB_WORKSPACE/part2-simulation timeout 3600 python -m pytest tests -q -p no:cacheprovider) > $p.log 2>&1
            code=$?; echo "exit $code" >> $p.log; [ $code -ne 0 ] && fail=1
            echo "::group::$p (exit $code)"; tail -30 $p.log; echo "::endgroup::"
          done
          exit $fail

  files:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: part5-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part4-simulation, ref: simscale, path: part4-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part1-simulation, ref: simscale, path: part1-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part2-simulation, ref: simscale, path: part2-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part3-simulation, ref: simscale, path: part3-simulation }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS "$SDK"
      - name: Start car, its manufacturing files and its SimScale flow domain
        working-directory: part5-simulation
        env:
          SIMSCALE_API_KEY: ${{ secrets.SIMSCALE_API_KEY }}
          SIMSCALE_PROJECT_ID: ${{ secrets.SIMSCALE_PROJECT_ID }}
        run: |
          python run_car.py --out ../out/start --body-json "$(cat checks/round2_car.json)" --skin-mm 1.117
          python -c "import json,sys; c=json.load(open('../out/start/summary.json'))['legality']['checks']['manufacture_files_are_solids']; print(c); sys.exit(0 if c['pass'] else 1)"
          # the probe is free (no mesh, no run): do it whenever the key is set
          cmd=domain
          [ -n "$SIMSCALE_API_KEY" ] && cmd=probe
          python ../part2-simulation/simscale_case.py $cmd ../out/start
          if [ "${{ inputs.simscale }}" = "car" ]; then
            python run_car.py --out ../out/start_cfd --body-json "$(cat checks/round2_car.json)" --cfd --res "${{ inputs.res }}" 2>&1 | tee ../out/start_cfd.log
            cat ../out/start_cfd/report.md >> $GITHUB_STEP_SUMMARY || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simscale-start
          path: |
            out/*/summary.json
            out/*/report.md
            out/*.log
            out/*/simscale/simscale.json
