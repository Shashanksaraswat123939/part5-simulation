name: cfdcheck

# The CFD model on one fixed car (checks/round2_car.json at its sized skin, so
# every job meshes identical geometry): old vs new wall treatment and wake
# refinement, a coarse/medium/fine study that now includes the wake, repeats
# for the noise, and the kOmegaSSTLM transition check. Push to cfdcheck/**.
on:
  workflow_dispatch:
  push:
    branches: ["cfdcheck/**"]

env:
  PY_DEPS: pytest numpy scipy pandas trimesh scikit-image shapely rtree mapbox-earcut manifold3d fast_simplification jax jaxlib matplotlib
  SKIN_MM: "1.117295093608557"

jobs:
  car:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          # the wall-resolved stack (y+ <= 2) on the round 2 car: layer settings
          # tuned at medium size, then the full ~5 M cell "resolved" mesh
          - { id: res_medium,     args: "--res medium --cfd-iters 400 --stage-timeout-s 18000", cfd: '{"wall_resolved": true}' }
          - { id: res_medium_a130, args: "--res medium --cfd-iters 400 --stage-timeout-s 18000", cfd: '{"wall_resolved": true, "layer_overrides": {"featureAngle": 130, "maxThicknessToMedialRatio": 0.3}}' }
          - { id: res_medium_outer, args: "--res medium --cfd-iters 400 --stage-timeout-s 18000", cfd: '{"wall_resolved": true, "layer_overrides": {"nOuterIter": 3, "nRelaxIter": 8}}' }
          - { id: resolved_5M,    args: "--res resolved --cfd-iters 300 --stage-timeout-s 18000", cfd: '{}' }
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
        with: { path: part5-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part4-simulation, path: part4-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part1-simulation, path: part1-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part2-simulation, path: part2-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part3-simulation, path: part3-simulation }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS
      - name: Install ESI OpenFOAM v2412
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y openfoam2412-default
      - name: Car ${{ matrix.id }}
        working-directory: part5-simulation
        run: |
          python run_car.py --out ../out/${{ matrix.id }} --np 4 --keep-runs --cfd --support beam \
            --body-json "$(cat checks/round2_car.json)" --skin-mm $SKIN_MM \
            --cfd-json '${{ matrix.cfd }}' ${{ matrix.args }} 2>&1 | tee ../out_${{ matrix.id }}.log
      - name: Collect solver logs
        if: always()
        run: |
          mkdir -p out/${{ matrix.id }}/solver_logs
          cp out_${{ matrix.id }}.log out/${{ matrix.id }}/ || true
          find part2-simulation/cfd_case_template -path "*/logs/*.log" 2>/dev/null | while read f; do
            tail -200 "$f" > "out/${{ matrix.id }}/solver_logs/$(basename "$f")"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfdcheck-${{ matrix.id }}
          path: |
            out/${{ matrix.id }}/summary.json
            out/${{ matrix.id }}/*.log
            out/${{ matrix.id }}/solver_logs/
