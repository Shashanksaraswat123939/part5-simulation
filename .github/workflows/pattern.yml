name: pattern

# One batch of the pattern search (pattern.py) on SimScale: every car in
# search/pattern_batch.json. The runners only build geometry and call the
# SimScale API; meshing and solving happen on SimScale. Push a batch to a
# simscale-pattern/** branch to run it.
#
# Needs repository secrets SIMSCALE_API_KEY and SIMSCALE_PROJECT_ID, and
# optionally the variable SIMSCALE_MAX_PARALLEL (runs SimScale may take at once).
on:
  workflow_dispatch:
  push:
    branches: ["simscale-pattern/**"]

env:
  PY_DEPS: pytest numpy scipy pandas trimesh scikit-image shapely rtree mapbox-earcut manifold3d fast_simplification jax jaxlib matplotlib requests
  SDK: git+https://github.com/SimScaleGmbH/simscale-python-sdk.git@19.1.0

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "ids=$(python3 -c 'import json;print(json.dumps(json.load(open("search/current.json"))["ids"]))')" >> $GITHUB_OUTPUT

  car:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.SIMSCALE_MAX_PARALLEL || '4') }}
      matrix:
        id: ${{ fromJSON(needs.setup.outputs.ids) }}
    env:
      SIMSCALE_API_KEY: ${{ secrets.SIMSCALE_API_KEY }}
      SIMSCALE_PROJECT_ID: ${{ secrets.SIMSCALE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { path: part5-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part4-simulation, ref: simscale, path: part4-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part1-simulation, ref: simscale, path: part1-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part2-simulation, ref: simscale, path: part2-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part3-simulation, ref: simscale, path: part3-simulation }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS "$SDK"
      - name: Car ${{ matrix.id }}
        working-directory: part5-simulation
        run: python pattern.py eval --id ${{ matrix.id }} --out ../out/c${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pattern-${{ matrix.id }}
          path: |
            out/c${{ matrix.id }}/pattern_*.json
            out/c${{ matrix.id }}/summary.json
            out/c${{ matrix.id }}/simscale/simscale.json
