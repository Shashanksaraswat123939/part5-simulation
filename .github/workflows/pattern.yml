name: pattern

# One batch of the pattern search (pattern.py): every car in
# search/pattern_batch.json, medium-mesh CFD, in parallel (GitHub runs ~20 at
# a time). Push a new batch to a pattern/** branch to run it.
on:
  workflow_dispatch:
  push:
    branches: ["pattern/**"]

env:
  PY_DEPS: pytest numpy scipy pandas trimesh scikit-image shapely rtree mapbox-earcut manifold3d fast_simplification jax jaxlib matplotlib

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "ids=$(python3 -c 'import json;print(json.dumps(json.load(open("search/current.json"))["ids"]))')" >> $GITHUB_OUTPUT

  car:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.setup.outputs.ids) }}
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
        with: { path: part5-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part4-simulation, path: part4-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part1-simulation, path: part1-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part2-simulation, path: part2-simulation }
      - uses: actions/checkout@v4
        with: { repository: Shashanksaraswat123939/part3-simulation, path: part3-simulation }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS
      - name: Install ESI OpenFOAM v2412
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y openfoam2412-default
      - name: Car ${{ matrix.id }}
        working-directory: part5-simulation
        run: python pattern.py eval --id ${{ matrix.id }} --out ../out/c${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pattern-${{ matrix.id }}
          path: |
            out/c${{ matrix.id }}/pattern_*.json
            out/c${{ matrix.id }}/summary.json
            out/c${{ matrix.id }}/body_half.stl
            out/c${{ matrix.id }}/manufacture/*.stl
